    <style>
:root {
            --bg: #fafafa;
            --bg-alt: #f0f0f0;
            --text: #1a1a1a;
            --text-muted: #6b6b6b;
            --link: #5ba3c0;
            --link-hover: #3d8aab;
            --border: #e0e0e0;
            --accent: #1a1a1a;
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #121212;
                --bg-alt: #1a1a1a;
                --text: #f0f0f0;
                --text-muted: #8a8a8a;
                --link: #7ec8e3;
                --link-hover: #a3daf0;
                --border: #2a2a2a;
                --accent: #f0f0f0;
            }
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html {
            font-size: 16px;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', 'Helvetica Neue', Helvetica, Arial, sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.5;
            min-height: 100vh;
        }
        a {
            color: var(--link);
            text-decoration: none;
            transition: color 0.2s ease;
        }
        a:hover {
            color: var(--link-hover);
            text-decoration: underline;
        }
        .gallery-container {
            max-width: 680px;
            margin: 0 auto;
            padding: 48px 24px 80px;
        }
        .gallery-header {
            margin-bottom: 32px;
        }
        .gallery-title {
            font-size: 1.5rem;
            font-weight: 600;
            letter-spacing: -0.02em;
            margin-bottom: 8px;
        }
        .gallery-back {
            font-size: 0.875rem;
        }
        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 16px;
        }
        .gallery-item {
            cursor: pointer;
            border-radius: 8px;
            overflow: hidden;
            transition: transform 0.2s ease;
        }
        .gallery-item:hover {
            transform: translateY(-2px);
        }
        .gallery-item img {
            width: 100%;
            aspect-ratio: 1 / 1;
            object-fit: cover;
            object-position: center;
            display: block;
        }
        .gallery-caption {
            padding: 12px;
            background: var(--bg-alt);
        }
        .gallery-description {
            font-size: 0.875rem;
            line-height: 1.4;
            margin-bottom: 6px;
        }
        .gallery-location {
            font-size: 0.8rem;
            color: var(--text-muted);
            font-weight: 500;
        }
        .lightbox {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.95);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }
        .lightbox.active {
            display: flex;
        }
        .lightbox-content {
            max-width: 90%;
            max-height: 90vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
        }
        .lightbox-image {
            max-width: 100%;
            max-height: 80vh;
            object-fit: contain;
        }
        .lightbox-info {
            text-align: center;
            color: #fff;
        }
        .lightbox-close {
            position: absolute;
            top: 24px;
            right: 24px;
            font-size: 2rem;
            color: #fff;
            cursor: pointer;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.1);
            transition: background 0.2s ease;
        }
        .lightbox-close:hover {
            background: rgba(255, 255, 255, 0.2);
        }
        @media (max-width: 600px) {
            .gallery-container {
                padding: 40px 20px 64px;
            }
            .gallery-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 12px;
            }
        }
    </style>
</head>

<body>
    <div class="gallery-container">
        <div class="gallery-header">
            <h1 class="gallery-title">Travel Gallery</h1>
            <p class="gallery-back">one random pic from every country I've visited</p>
        </div>
        <div class="gallery-grid" id="gallery"></div>
    </div>

    <div class="lightbox" id="lightbox">
        <div class="lightbox-close" onclick="closeLightbox()">×</div>
        <div class="lightbox-content">
            <img src="" alt="" class="lightbox-image" id="lightbox-img">
            <div class="lightbox-info">
                <div class="gallery-description" id="lightbox-desc"></div>
                <div class="gallery-location" id="lightbox-loc"></div>

        function loadGallery() {
            const gallery = document.getElementById('gallery');
            travelImages.forEach((img, index) => {
                const item = document.createElement('div');
                item.className = 'gallery-item';
                item.onclick = () => openLightbox(index);
                item.innerHTML = `
                    <img src="${img.src}" alt="${img.description}" onerror="this.style.display='none'">
                    <div class="gallery-caption">
                        <div class="gallery-description">${img.description}</div>
                        <div class="gallery-location">${img.location}</div>
                    </div>
                `;
                gallery.appendChild(item);
            });
        }

        function openLightbox(index) {
            const lightbox = document.getElementById('lightbox');
            const img = document.getElementById('lightbox-img');
            const desc = document.getElementById('lightbox-desc');
            const loc = document.getElementById('lightbox-loc');
            
            img.src = travelImages[index].src;
            img.alt = travelImages[index].description;
            desc.textContent = travelImages[index].description;
            loc.textContent = travelImages[index].location;
            
            lightbox.classList.add('active');
        }

        function closeLightbox() {
            document.getElementById('lightbox').classList.remove('active');
        }

        document.getElementById('lightbox').addEventListener('click', function(e) {
            if (e.target === this) {
                closeLightbox();
            }
        });

        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                closeLightbox();
            }
        });

        loadGallery();
    </script>
